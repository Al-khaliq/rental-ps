<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <radialGradient id="spot4p" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00439C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="proBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3548"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="236" rx="140" ry="18" fill="#000" fill-opacity="0.45"/>
  <circle cx="200" cy="140" r="120" fill="url(#spot4p)"/>

  <!-- PS4 Pro 3-Tier Console -->
  <g transform="translate(62, 70)">
    <!-- Tier 1 -->
    <polygon points="8,0 220,0 214,20 2,20" fill="url(#proBody)" stroke="#334155" stroke-width="1"/>
    <!-- Tier 2 -->
    <polygon points="4,22 216,22 210,42 0,42" fill="#182032" stroke="#334155" stroke-width="1"/>
    <!-- Tier 3 -->
    <polygon points="2,44 214,44 208,64 0,64" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <!-- Blue LED strip -->
    <line x1="12" y1="21" x2="72" y2="21" stroke="#0070D1" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="21" x2="52" y2="21" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Disc slot -->
    <rect x="85" y="42" width="88" height="2.5" fill="#020617"/>
    <!-- 4K HDR Badge -->
    <rect x="165" y="5" width="44" height="11" rx="3" fill="#00439C" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="172" y="13" fill="#F8FAFC" font-family="sans-serif" font-size="7" font-weight="bold">4K HDR</text>
  </g>

  <!-- DualShock 4 Black Controller -->
  <g transform="translate(192, 134)">
    <path d="M22,34 C22,16 42,10 58,18 L102,18 C118,10 138,16 138,34 L148,80 C151,95 135,104 122,92 L107,72 L53,72 L38,92 C25,104 9,95 12,80 Z" fill="#181F2E" stroke="#334155" stroke-width="1.2"/>
    <rect x="57" y="19" width="46" height="26" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="64" y="21" width="32" height="2.5" rx="1" fill="#0070D1"/>
    <circle cx="58" cy="58" r="9" fill="#090D16" stroke="#475569" stroke-width="1.5"/>
    <circle cx="102" cy="58" r="9" fill="#090D16" stroke="#475569" stroke-width="1.5"/>
    <rect x="32" y="34" width="14" height="4" rx="1" fill="#334155"/>
    <rect x="37" y="29" width="4" height="14" rx="1" fill="#334155"/>
    <circle cx="122" cy="29" r="3" fill="#10B981"/>
    <circle cx="129" cy="36" r="3" fill="#EF4444"/>
    <circle cx="122" cy="43" r="3" fill="#3B82F6"/>
    <circle cx="115" cy="36" r="3" fill="#EC4899"/>
    <circle cx="80" cy="58" r="3.5" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
  </g>
</svg>
