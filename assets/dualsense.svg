<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <radialGradient id="spotDS" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#0070D1" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#00439C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dsWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="225" rx="115" ry="16" fill="#000" fill-opacity="0.45"/>
  <circle cx="200" cy="135" r="115" fill="url(#spotDS)"/>

  <!-- DualSense Close-up -->
  <g transform="translate(80, 52) scale(1.5)">
    <!-- Body -->
    <path d="M22,34 C22,16 42,10 58,18 L102,18 C118,10 138,16 138,34 L148,80 C151,95 135,104 122,92 L107,72 L53,72 L38,92 C25,104 9,95 12,80 Z" fill="url(#dsWhite)"/>
    <!-- Black grip inner -->
    <path d="M47,52 L113,52 L107,72 L53,72 Z" fill="#0F172A"/>
    <!-- Touchpad -->
    <path d="M54,18 L106,18 L101,46 L59,46 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.9"/>
    <!-- Blue Lightbar -->
    <path d="M54,20 L59,46 M106,20 L101,46" stroke="#0070D1" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M54,20 L59,46 M106,20 L101,46" stroke="#38BDF8" stroke-width="1" stroke-linecap="round"/>
    <!-- Analog sticks -->
    <circle cx="58" cy="60" r="9.5" fill="#1E293B" stroke="#475569" stroke-width="1.3"/>
    <circle cx="58" cy="60" r="6" fill="#0F172A"/>
    <circle cx="102" cy="60" r="9.5" fill="#1E293B" stroke="#475569" stroke-width="1.3"/>
    <circle cx="102" cy="60" r="6" fill="#0F172A"/>
    <!-- D-Pad -->
    <rect x="32" y="34" width="13" height="4.5" rx="1" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.7"/>
    <rect x="36.25" y="29.75" width="4.5" height="13" rx="1" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.7"/>
    <!-- Face buttons -->
    <circle cx="122" cy="29" r="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
    <circle cx="129" cy="36" r="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
    <circle cx="122" cy="43" r="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
    <circle cx="115" cy="36" r="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
    <!-- PS button -->
    <circle cx="80" cy="60" r="3.5" fill="#0070D1"/>
    <!-- Speaker dots -->
    <circle cx="76" cy="52" r="0.8" fill="#64748B"/>
    <circle cx="80" cy="52" r="0.8" fill="#64748B"/>
    <circle cx="84" cy="52" r="0.8" fill="#64748B"/>
  </g>
</svg>
